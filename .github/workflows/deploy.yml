name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # weekly rebuild to refresh GitHub stars and Crossref citations
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # keep the downloadable PDFs in sync with /cv (falls back to the committed ones)
      - name: Render CV PDFs
        continue-on-error: true
        run: |
          python3 -m http.server 4321 -d dist >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer --virtual-time-budget=6000 --print-to-pdf=dist/cv-antonio-paya.pdf http://localhost:4321/cv/
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer --virtual-time-budget=6000 --print-to-pdf=dist/cv-antonio-paya-en.pdf http://localhost:4321/en/cv/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
