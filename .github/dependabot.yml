version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # minor/patch updates are merged automatically once CI passes
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is not supported by @astrojs/check yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
